services:
  server:
    build: .
    ports:
      # 0.0.0.0 intentional — ESP32 connects over LAN; restrict to LAN IP if firewall is needed
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
